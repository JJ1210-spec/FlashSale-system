<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Flash Sale</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Phone Flash Sale</h1>
    <p>Only 500 phones available.</p>
    <p class="availability">Available now: <strong id="stock">Checking…</strong></p>
    <button id="buy" type="button" disabled>Buy now</button>
    <p id="message" role="status" aria-live="polite">Connecting…</p>
    <p class="note">Your order is confirmed only when the status says “Confirmed”.</p>
  </main>
</body>
</html>
